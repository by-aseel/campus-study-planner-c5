[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-study-planner"
version = "1.0.0"
description = "A three-tool FastMCP toolkit with an OpenAI Agents SDK host using Groq or OpenRouter."
requires-python = ">=3.11"
dependencies = [
  "fastmcp==4.1.3",
  "openai-agents==0.24.0",
  "openai==3.37.0",
  "pydantic==2.14.1",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

